name: Cloudflare Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler types
      - run: npx tsc --noEmit
      - name: Compile Python runtime
        run: python -m py_compile app.py bot.py bot_runner.py reloads.py
      - name: Build Cloudflare Container image
        run: docker build --platform linux/amd64 -t self-cloudflare:test .
